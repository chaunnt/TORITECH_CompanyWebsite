<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trận bóng ngẫu nhiên</title>
<style>
:root{--bg:#0e1411;--panel:#17201b;--line:#26332c;--ink:#eaf2ed;--mut:#8fa397;--acc:#f5c542}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px;gap:10px;min-height:100vh}
.board{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;width:100%;max-width:920px}
.team{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-weight:650;font-size:15px}
.team.r{justify-content:flex-end;text-align:right}
.sw{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 0 2px #ffffff30}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid{display:flex;flex-direction:column;align-items:center;flex:none}
.score{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;line-height:1.1}
.clock{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;margin-top:2px}
.bar{height:4px;width:100%;max-width:920px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:-4px}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
.stage{position:relative}
canvas{display:block;border-radius:10px;touch-action:manipulation}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .25s;text-align:center;padding:10px}
.ov.show{opacity:1}
.ov .big{font-size:clamp(30px,8vw,60px);font-weight:900;color:#fff;text-shadow:0 3px 14px #000b;letter-spacing:1px}
.ov .sub{font-size:17px;font-weight:600;color:#fff;text-shadow:0 2px 8px #000b;margin-top:6px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:15px;font-weight:600;cursor:pointer}
button.on{background:var(--acc);color:#1a1a1a;border-color:var(--acc)}
button.pri{background:#2a9d5c;border-color:#2a9d5c;color:#fff}
.info{width:100%;max-width:920px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.card h3{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);font-weight:700}
.log{max-height:190px;overflow:auto}
.log div{padding:4px 0;border-bottom:1px solid #ffffff0c}
.log div:last-child{border:0}
.st{display:grid;grid-template-columns:3em 1fr 3em;padding:4px 0;font-variant-numeric:tabular-nums}
.st span:nth-child(2){text-align:center;color:var(--mut)}
.st span:last-child{text-align:right}
.note{font-size:12px;color:var(--mut);text-align:center}
.capw{height:34px;width:100%;max-width:920px;display:flex;justify-content:center;margin:-4px 0}
.cap{max-width:100%;background:rgba(0,0,0,.68);color:#fff;font-weight:650;font-size:15px;padding:6px 14px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s;pointer-events:none}
.cap.show{opacity:1}
#vn{font-size:12px;color:var(--mut);text-align:center;min-height:1em}
@media (max-width:560px){.info{grid-template-columns:1fr}.score{font-size:26px}.team{font-size:14px}}
</style>
</head>
<body>
<div class="board">
  <div class="team"><span class="sw" id="c0"></span><span class="nm" id="n0"></span></div>
  <div class="mid"><div class="score" id="sc">0 - 0</div><div class="clock" id="ck">Hiệp 1 · 0'</div></div>
  <div class="team r"><span class="nm" id="n1"></span><span class="sw" id="c1"></span></div>
</div>
<div class="bar"><i id="pb"></i></div>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="ov" id="ov"><div class="big" id="ovb"></div><div class="sub" id="ovs"></div></div>
</div>
<div class="capw"><div class="cap" id="cap"></div></div>
<div class="ctrl">
  <button id="bs" class="pri">🔇 Bình luận: tắt</button>
  <button id="bp">⏸ Tạm dừng</button>
  <button id="bn" class="pri">🔄 Trận mới</button>
  <button class="spd on" data-s="1">x1</button>
  <button class="spd" data-s="2">x2</button>
  <button class="spd" data-s="4">x4</button>
</div>
<div id="vn"></div>
<div class="info">
  <div class="card"><h3>Diễn biến</h3><div class="log" id="lg"></div></div>
  <div class="card"><h3>Thống kê</h3><div id="stats"></div></div>
</div>
<div class="note">Mỗi hiệp 1 phút · đội hình, phong độ, từng đường chuyền và cú sút đều ngẫu nhiên</div>

<script>
"use strict";
const W=105,H=68,M=3,GW=7.32,GY1=H/2-GW/2,GY2=H/2+GW/2,HALF=60,STEP=1/60;
const POOL=[["Sấm Sét FC","#e63946","#ffffff"],["Rồng Xanh","#1f9e89","#ffffff"],["Hải Âu","#7cc6fe","#0b2545"],["Báo Đen","#1c1f26","#f5c542"],["Phượng Hoàng","#f4a261","#3d1f00"],["Sư Tử Vàng","#ffd166","#4a3000"],["Cá Mập","#3a6bff","#ffffff"],["Đại Bàng","#8338ec","#ffffff"],["Ong Bắp Cày","#fb8500","#111111"],["Tuyết Lở","#f1f1f1","#c1121f"]];
const GKC=[["#b5e61d","#111"],["#ff66c4","#111"]];
// [vai trò, x (tính từ khung thành nhà), y, số áo]
const FORM=[["GK",2,34,1],["DF",18,9,2],["DF",15,25,4],["DF",15,43,5],["DF",18,59,3],["MF",33,12,7],["MF",30,27,6],["MF",30,41,8],["MF",33,56,11],["FW",46,28,9],["FW",46,40,10]];

const R=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const fx=(t,x)=>t.dir===1?x:W-x;          // toạ độ theo hướng tấn công của đội -> toạ độ sân
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d};
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-ax-t*dx,py-ay-t*dy)}

const MIDN=["Văn","Đức","Minh","Hoàng","Quốc","Thành","Hữu","Tuấn","Gia","Bảo","Công","Xuân","Thanh","Anh"];
const GIVN=["Hùng","Long","Phong","Khang","Tài","Lộc","Nam","Sơn","Huy","Kiệt","Trí","Dũng","Hiếu","Khoa","Vinh","Đạt","Tâm","Thịnh","Phát","Nhân","Bình","Cường","Duy","Hải","Khải","Lâm","Quân","Thắng","Tú","Việt"];
const used=new Set();
function makeNick(){let n,k=0;do{n=MIDN[Math.floor(Math.random()*MIDN.length)]+" "+GIVN[Math.floor(Math.random()*GIVN.length)];k++}while(used.has(n)&&k<200);used.add(n);return n}

let G=null;
const UI={log(){},ov(){},hide(){},say(){}};

function newMatch(){
  const CG=[0,1,2,3,4,4,2,5,4,6];const i=Math.floor(Math.random()*POOL.length);let j;do j=Math.floor(Math.random()*POOL.length);while(CG[j]===CG[i]);
  const teams=[i,j].map((k,idx)=>({idx,name:POOL[k][0],color:POOL[k][1],text:POOL[k][2],gk:GKC[idx],
    str:R(0.8,1.2),mom:0,dir:idx===0?1:-1,score:0,shots:0,onT:0,saves:0,poss:0,players:[]}));
  used.clear();
  teams.forEach(t=>FORM.forEach(f=>{
    const sk=clamp(t.str*R(0.82,1.18),0.6,1.45);
    t.players.push({team:t,role:f[0],nick:makeNick(),home:{x:f[1],y:f[2]},num:f[3],x:0,y:0,vx:0,vy:0,skill:sk,
      speed:(f[0]==="GK"?8.5:R(9.2,11.2))*(0.92+0.08*sk),noTouch:0,decide:0,dribAng:0,wob:0,wobTo:0,wobT:0});
  }));
  G={teams,half:1,t:0,state:"pause",stateT:1,firstKick:Math.random()<.5?0:1,nextKick:null,
     ball:{x:W/2,y:H/2,vx:0,vy:0,owner:null,ownT:0,lastTouch:null,lastKicker:null,shot:false,intended:null}};
  kickoff(G.teams[G.firstKick]);
}
const other=t=>G.teams[1-t.idx];
const eff=p=>p.skill*(1+p.team.mom);
const minute=()=>Math.min(45,Math.floor(G.t/HALF*45)+1)+(G.half-1)*45;

function giveBall(p,why){
  const b=G.ball,prev=b.lastTouch;
  b.owner=p;b.ownT=0;b.lastTouch=p.team;b.shot=false;b.shotFlag=false;b.intended=null;p.decide=R(.15,.4);p.dribAng=R(-.5,.5);
  if(why==="tackle")UI.say(`Tắc bóng! ${p.nick}!`,2,{pitch:1.25,rate:1.3});
  else if(why==="play"){
    if(prev&&prev!==p.team)UI.say(`${p.nick} cắt bóng!`,2,{pitch:1.2,rate:1.3});
    else UI.say(p.nick,1);
  }
}

function kickoff(t){
  const b=G.ball;b.x=W/2;b.y=H/2;b.vx=b.vy=0;b.owner=null;b.shot=false;
  G.teams.forEach(tm=>tm.players.forEach(p=>{
    const hx=tm===t?Math.min(p.home.x,50):Math.min(p.home.x,41);
    p.x=fx(tm,hx);p.y=p.home.y;p.vx=p.vy=0;p.noTouch=0;
  }));
  const a=t.players.find(p=>p.num===9),c=t.players.find(p=>p.num===10);
  a.x=W/2-t.dir*0.9;a.y=H/2;c.x=W/2-t.dir*1.5;c.y=H/2+7;
  giveBall(a);b.ownT=-0.6;
  G.state="pause";G.stateT=1;
  UI.say(`${t.name} giao bóng. ${a.nick}`,2);
}

function restart(t,x,y,label,useGK){
  const b=G.ball;b.x=x;b.y=y;b.vx=b.vy=0;
  let p;
  if(useGK)p=t.players[0];
  else{let bd=1e9;t.players.forEach(q=>{if(q.role==="GK")return;const d=Math.hypot(q.x-x,q.y-y);if(d<bd){bd=d;p=q}})}
  p.x=x-(x>W/2?-0.6:0.6)*(useGK?-1:0);p.y=y;p.vx=p.vy=0;
  other(t).players.forEach(q=>{const d=Math.hypot(q.x-x,q.y-y);if(d<6&&d>0){q.x+=(q.x-x)/d*(6-d);q.y=clamp(q.y+(q.y-y)/d*(6-d),0.5,H-.5)}});
  giveBall(p);b.ownT=-0.7;
  G.state="pause";G.stateT=0.7;
  if(label){UI.log(`${minute()}' ${label} — ${t.name}`,true);UI.say(`Phạt góc! ${p.nick} đá phạt.`,2,{pitch:1.15})}
  else if(useGK)UI.say(`Phát bóng lên, ${p.nick}`,1);
  else UI.say(`Ném biên, ${p.nick}`,1);
}

function step(dt){
  const b=G.ball;
  if(G.state==="end")return;
  if(G.state!=="play"){
    G.stateT-=dt;
    if(G.state==="goal"){ballPhysics(dt,true);G.teams.forEach(t=>t.players.forEach(p=>moveTo(p,p.x,p.y,0,dt)))}
    if(G.stateT>0)return;
    if(G.state==="goal"){UI.hide();kickoff(G.nextKick);return}
    if(G.state==="ht"){UI.hide();G.half=2;G.t=0;G.teams.forEach(t=>t.dir*=-1);kickoff(G.teams[1-G.firstKick]);return}
    G.state="play";
  }
  G.t+=dt;
  if(G.t>=HALF){
    G.t=HALF;
    const s=`${G.teams[0].name} ${G.teams[0].score} - ${G.teams[1].score} ${G.teams[1].name}`;
    const a=G.teams[0].score,c=G.teams[1].score;
    if(G.half===1){G.state="ht";G.stateT=3;UI.ov("HẾT HIỆP 1",s);UI.log("⏱ Hết hiệp 1",true);
      UI.say(`Hết hiệp một! Tỉ số đang là ${a} ${c}.`,4,{rate:1.1})}
    else{G.state="end";
      const res=a===c?`Hoà ${a} - ${c}`:`${(a>c?G.teams[0]:G.teams[1]).name} thắng ${Math.max(a,c)} - ${Math.min(a,c)}`;
      UI.ov("HẾT TRẬN",res);UI.log("🏁 Hết trận",true);
      UI.say(`Trận đấu kết thúc! ${a===c?`Hai đội hoà nhau ${a} đều.`:`${(a>c?G.teams[0]:G.teams[1]).name} giành chiến thắng ${Math.max(a,c)} ${Math.min(a,c)}!`}`,5,{rate:1.1,pitch:1.1})}
    return;
  }
  G.teams.forEach(t=>{t.mom=clamp(t.mom+gauss()*0.06*Math.sqrt(dt),-0.18,0.18)});
  if(b.owner){b.owner.team.poss+=dt;b.ownT+=dt}
  G.teams.forEach(t=>{
    const arr=t.players.filter(p=>p.role!=="GK").map(p=>[p,Math.hypot(p.x-b.x,p.y-b.y)]).sort((a,c)=>a[1]-c[1]);
    t.chaser=arr[0][0];t.chaser2=arr[1][0];t.chaseD=arr[0][1];
  });
  for(const t of G.teams)for(const p of t.players){
    p.noTouch-=dt;p.wobT-=dt;
    if(p.wobT<=0){p.wobT=R(1.5,4);p.wobTo=R(-5,5)}
    p.wob+=(p.wobTo-p.wob)*Math.min(1,dt*0.8);
    if(p===b.owner)ownerAI(p,dt);
    else if(p.role==="GK")gkAI(p,dt);
    else fieldAI(p,dt);
  }
  separate();
  if(G.state!=="play")return;
  ballPhysics(dt,false);
  if(G.state==="play")tackles(dt);
}

function moveTo(p,tx,ty,sp,dt){
  const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);let dvx=0,dvy=0;
  if(d>0.05){const s=Math.min(sp,d*2.5);dvx=dx/d*s;dvy=dy/d*s}
  const k=Math.min(1,dt*5);p.vx+=(dvx-p.vx)*k;p.vy+=(dvy-p.vy)*k;
  p.x=clamp(p.x+p.vx*dt,-2,W+2);p.y=clamp(p.y+p.vy*dt,-1.5,H+1.5);
}

function separate(){
  const all=G.teams[0].players.concat(G.teams[1].players);
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){
    const a=all[i],c=all[j],dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy);
    if(d<1.3&&d>0.001){const o=(1.3-d)/2,ux=dx/d,uy=dy/d;a.x-=ux*o;a.y-=uy*o;c.x+=ux*o;c.y+=uy*o}
  }
}

function fieldAI(p,dt){
  const t=p.team,b=G.ball,ballF=fx(t,b.x);
  const hasPoss=b.owner&&b.owner.team===t,oppPoss=b.owner&&b.owner.team!==t,loose=!b.owner;
  if(loose&&(p===t.chaser||p===b.intended)){
    const lead=Math.min(0.6,Math.hypot(p.x-b.x,p.y-b.y)/14);
    moveTo(p,b.x+b.vx*lead,b.y+b.vy*lead,p.speed,dt);return;
  }
  if(oppPoss&&p===t.chaser){moveTo(p,b.x+b.vx*0.2,b.y+b.vy*0.2,p.speed,dt);return}
  if(oppPoss&&p===t.chaser2){
    const gx=fx(t,0);moveTo(p,b.x+(gx-b.x)*0.22,b.y+(34-b.y)*0.22,p.speed*0.85,dt);return;
  }
  let hx=p.home.x+(ballF-52.5)*0.55+(hasPoss?13:1);
  if(hasPoss&&p.role==="FW")hx=Math.max(hx,ballF+12);
  if(hasPoss&&p.role==="MF")hx=Math.max(hx,ballF-6);
  if(p.role==="DF")hx=clamp(hx,7,68);else if(p.role==="MF")hx=clamp(hx,14,88);else hx=clamp(hx,25,94);
  let hy=p.home.y+(b.y-34)*(p.role==="DF"?0.3:0.4)+p.wob;
  if(hasPoss&&p.role==="FW"&&ballF>70)hy=34+(p.home.y-34)*0.6+p.wob;
  moveTo(p,fx(t,hx),clamp(hy,1.5,H-1.5),p.speed*(hasPoss?0.8:0.7),dt);
}

function gkAI(p,dt){
  const t=p.team,b=G.ball,bF=fx(t,b.x);
  let tF=1.4;if(bF<32)tF+=(32-bF)*0.13;
  let ty=clamp(34+(b.y-34)*0.3,GY1-0.3,GY2+0.3);
  if(!b.owner&&b.shot&&Math.sign(b.vx)===-t.dir){
    const gxw=fx(t,tF),tt=(b.x-gxw)/(-b.vx);
    if(tt>0)ty=clamp(b.y+b.vy*tt,GY1-1.2,GY2+1.2);
    moveTo(p,gxw,ty,p.speed*1.3,dt);return;
  }
  if(!b.owner&&bF<16.5&&Math.abs(b.y-34)<20){
    const me=Math.hypot(p.x-b.x,p.y-b.y);
    if(me<other(t).chaseD*1.1+1){moveTo(p,b.x,b.y,p.speed,dt);return}
  }
  moveTo(p,fx(t,tF),ty,p.speed*0.8,dt);
}

function nearestOpp(p){let bd=1e9,q=null;for(const o of other(p.team).players){const d=dist(o,p);if(d<bd){bd=d;q=o}}return[q,bd]}

function ownerAI(p,dt){
  const t=p.team,b=G.ball,gx=fx(t,W+0.5),gy=H/2,dG=Math.hypot(gx-p.x,gy-p.y),pF=fx(t,p.x);
  const [nq,near]=nearestOpp(p);
  p.decide-=dt;
  if(p.decide<=0&&b.ownT>0.02){
    p.decide=R(.18,.45);
    if(p.role==="GK"){if(b.ownT>0.8){pass(p,true);return}}
    else{
      let sP=dG<11?0.85:dG<18?0.55:dG<26?0.28:dG<34?0.12:dG<40?0.04:0;
      const ang=Math.abs(p.y-34)/Math.max(1,W-pF);if(ang>1.1)sP*=0.25;
      sP*=1+t.mom*2;
      if(Math.random()<sP){shoot(p);return}
      let pP=near<2.5?0.55:near<5?0.25:0.06;if(pF<30)pP+=0.1;if(pF>88&&Math.abs(p.y-34)>14)pP+=0.35;
      if(Math.random()<pP&&pass(p,false))return;
      p.dribAng=R(-0.6,0.6);
    }
  }
  if(p.role==="GK"){moveTo(p,p.x,p.y,0,dt);keepBall(p);return}
  let a=Math.atan2(gy-p.y,gx-p.x)+p.dribAng*(dG>22?1:0.4);
  if(nq&&near<5){const oa=Math.atan2(nq.y-p.y,nq.x-p.x),df=angDiff(oa,a);if(Math.abs(df)<1.2)a-=(df>=0?1:-1)*0.85}
  moveTo(p,p.x+Math.cos(a)*6,clamp(p.y+Math.sin(a)*6,1.5,H-1.5),p.speed*(near<4?1:0.9),dt);
  keepBall(p);
}
function keepBall(p){
  const b=G.ball,sp=Math.hypot(p.vx,p.vy);
  const hx=sp>0.4?p.vx/sp:p.team.dir,hy=sp>0.4?p.vy/sp:0;
  b.x=p.x+hx*0.95;b.y=p.y+hy*0.95;b.vx=p.vx;b.vy=p.vy;
}

function kick(p,tx,ty,speed,err){
  const b=G.ball,a=Math.atan2(ty-p.y,tx-p.x)+gauss()*err;
  b.owner=null;b.vx=Math.cos(a)*speed;b.vy=Math.sin(a)*speed;
  b.x=p.x+Math.cos(a)*1.0;b.y=p.y+Math.sin(a)*1.0;
  b.lastTouch=p.team;b.lastKicker=p;b.shot=false;b.intended=null;p.noTouch=0.35;
}

function pass(p,long){
  const t=p.team,opps=other(t).players;let best=null,bs=-1e9;
  for(const m of t.players){
    if(m===p||m.role==="GK")continue;
    const lx=clamp(m.x+m.vx*0.45,1,W-1),ly=clamp(m.y+m.vy*0.45,1,H-1),d=Math.hypot(lx-p.x,ly-p.y);
    if(d<5||d>(long?60:38))continue;
    const prog=fx(t,lx)-fx(t,p.x);
    let open=1e9,mark=1e9;
    for(const q of opps){open=Math.min(open,segDist(q.x,q.y,p.x,p.y,lx,ly));mark=Math.min(mark,Math.hypot(q.x-lx,q.y-ly))}
    let s=prog*(prog>0?1.1:1.6)+Math.min(open,6)*2.2+Math.min(mark,8)*1.2-d*0.08+R(0,8);
    if(open<1.3)s-=12;
    if(s>bs){bs=s;best=[m,lx,ly,d]}
  }
  if(!best||(!long&&bs<-3))return false;
  if(!long&&best[0]&&fx(t,best[1])<fx(t,p.x)-3&&nearestOpp(p)[1]>3.5&&Math.random()<0.7)return false;
  kick(p,best[1],best[2],Math.min(32,best[3]*0.95+7),0.05/eff(p));
  G.ball.intended=best[0];
  return true;
}

function shoot(p){
  const t=p.team,b=G.ball,gx=fx(t,W)+t.dir,gy=R(GY1+0.35,GY2-0.35);
  const d=Math.hypot(gx-p.x,gy-p.y),err=(0.03+d*0.0024)/eff(p);
  kick(p,gx,gy,R(27,36)*(0.95+0.08*eff(p)),err);
  b.shot=true;b.shotFlag=true;t.shots++;
  UI.say(d>22?`${p.nick} sút xa!`:`${p.nick} sút!`,3,{pitch:1.4,rate:1.35});
  const lineX=fx(t,W),tt=(lineX-b.x)/b.vx;
  if(tt>0){const yy=b.y+b.vy*tt;if(yy>GY1&&yy<GY2)t.onT++}
}

function inOwnBox(p,b){return fx(p.team,b.x)<17&&Math.abs(b.y-34)<21}

function ballPhysics(dt,celebrating){
  const b=G.ball;if(b.owner)return;
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  const f=Math.exp(-(b.shot?0.3:0.95)*dt);b.vx*=f;b.vy*=f;
  if(celebrating){
    if(b.x<-1.8){b.x=-1.8;b.vx*=-0.2}if(b.x>W+1.8){b.x=W+1.8;b.vx*=-0.2}
    b.y=clamp(b.y,GY1+0.3,GY2-0.3);b.vx*=0.9;b.vy*=0.9;return;
  }
  if(Math.hypot(b.vx,b.vy)<10)b.shot=false;
  if(b.x<0||b.x>W){
    const side=b.x<0?0:1;                                   // 0: khung thành bên trái
    const def=G.teams.find(t=>(t.dir===1)===(side===0));    // đội phòng ngự cánh đó
    const att=other(def);
    if(b.y>GY1&&b.y<GY2){goal(att);return}
    if(b.shotFlag&&b.lastKicker&&b.lastKicker.team===att){UI.say(`Ôi! Bóng đi chệch cột dọc! Tiếc cho ${b.lastKicker.nick}!`,3,{pitch:1.3,rate:1.3});UI.log(`${minute()}' ❌ ${b.lastKicker.nick} sút ra ngoài`)}
    if(b.lastTouch===def)restart(att,side?W-0.5:0.5,b.y<34?0.5:H-0.5,"🚩 Phạt góc");
    else restart(def,fx(def,5.5),34+(b.y<34?-6:6),null,true);
    return;
  }
  if(b.y<0||b.y>H){const t=b.lastTouch?other(b.lastTouch):G.teams[0];restart(t,clamp(b.x,1,W-1),b.y<0?0.3:H-0.3,null);return}
  let best=null,bd=1e9;
  for(const t of G.teams)for(const p of t.players){
    if(p.noTouch>0)continue;
    const reach=p.role==="GK"&&inOwnBox(p,b)?1.9:1.05,d=Math.hypot(p.x-b.x,p.y-b.y);
    if(d<reach&&d<bd){best=p;bd=d}
  }
  if(!best)return;
  const s=Math.hypot(b.vx,b.vy);
  if(best.role==="GK"&&inOwnBox(best,b)&&(b.shot||s>13)&&b.lastTouch!==best.team){
    const sv=clamp(0.55*eff(best)+0.3-(s-30)*0.015-(bd-1)*0.15,0.25,0.9);
    if(Math.random()<sv){
      best.team.saves++;
      if(Math.random()<0.55){giveBall(best,"save");best.decide=R(.9,1.5);UI.log(`${minute()}' 🧤 ${best.nick} (${best.team.name}) bắt gọn`);
        UI.say(`Cứu thua! ${best.nick} bắt gọn!`,3,{pitch:1.35,rate:1.3})}
      else{b.vx=-b.vx*R(0.15,0.4);b.vy=R(-1,1)*R(6,14);b.shot=false;b.shotFlag=false;b.lastTouch=best.team;b.lastKicker=best;best.noTouch=0.6;UI.log(`${minute()}' 🧤 ${best.nick} (${best.team.name}) đẩy bóng`);
        UI.say(`Không thể tin được! ${best.nick} đẩy bóng cứu thua!`,3,{pitch:1.4,rate:1.35})}
    }else best.noTouch=1;
  }else if(s<14||(best===b.intended&&s<24&&Math.random()<0.9)||Math.random()<(s<24?0.55:0.2)*eff(best)){
    giveBall(best,"play");
  }else{
    if(Math.random()<0.4){b.vx*=R(-0.4,0.5);b.vy+=R(-9,9);b.shot=false;b.lastTouch=best.team;b.lastKicker=best}
    best.noTouch=0.4;
  }
}

function tackles(dt){
  const b=G.ball,o=b.owner;if(!o||b.ownT<0.35)return;
  for(const q of other(o.team).players){
    if(q.role==="GK"&&!inOwnBox(q,b))continue;
    if(dist(q,o)<1.45&&Math.random()<1.2*eff(q)/eff(o)*dt){
      if(Math.random()<0.55){giveBall(q,"tackle");o.noTouch=0.7}
      else{const a=R(0,Math.PI*2);b.owner=null;b.vx=Math.cos(a)*R(5,10);b.vy=Math.sin(a)*R(5,10);b.lastTouch=q.team;b.lastKicker=q;b.shot=false;o.noTouch=0.5;q.noTouch=0.25}
      return;
    }
  }
}

function goal(t){
  const b=G.ball,k=b.lastKicker;t.score++;
  const og=k&&k.team!==t;
  UI.log(`${minute()}' ⚽ ${t.name} ghi bàn${og?` (${k.nick} phản lưới nhà)`:k?` — ${k.nick} (số ${k.num})`:""}`,true,t.color);
  UI.say(og?`Vào! Ôi không! ${k.nick} đá phản lưới nhà! ${t.name} có bàn thắng!`
           :`Vàooo! Vào! Vàooo! ${k?k.nick:""} ghi bàn cho ${t.name}! Tỉ số ${G.teams[0].score} ${G.teams[1].score}!`,5,{pitch:1.5,rate:1.25});
  UI.ov("VÀOOO!",`${t.name}  ${G.teams[0].score} - ${G.teams[1].score}`);
  G.state="goal";G.stateT=2.6;G.nextKick=other(t);b.shot=false;
}

/* ---------------- Vẽ ---------------- */
const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),stage=document.getElementById("stage");
let view={s:1,portrait:false,cw:0,ch:0,dpr:1};
function layout(){
  const maxW=Math.min(window.innerWidth-24,920),maxH=window.innerHeight*0.62;
  const portrait=window.innerWidth<window.innerHeight&&window.innerWidth<700;
  const fw=(portrait?H:W)+2*M,fh=(portrait?W:H)+2*M;
  const s=Math.min(maxW/fw,Math.max(maxH,260)/fh);
  const cw=Math.floor(fw*s),ch=Math.floor(fh*s),dpr=window.devicePixelRatio||1;
  cv.style.width=cw+"px";cv.style.height=ch+"px";cv.width=cw*dpr;cv.height=ch*dpr;
  view={s,portrait,cw,ch,dpr};
}
function worldT(){
  const {s,portrait,cw,dpr}=view;ctx.setTransform(dpr,0,0,dpr,0,0);
  if(portrait){ctx.translate(cw,0);ctx.rotate(Math.PI/2)}
  ctx.scale(s,s);ctx.translate(M,M);
}
function toScreen(x,y){const {s,portrait,cw}=view;return portrait?[cw-(y+M)*s,(x+M)*s]:[(x+M)*s,(y+M)*s]}

function drawPitch(){
  ctx.fillStyle="#2f7a3e";ctx.fillRect(-M,-M,W+2*M,H+2*M);
  for(let i=0;i<14;i++){ctx.fillStyle=i%2?"#378a47":"#327f42";ctx.fillRect(i*W/14,0,W/14+0.02,H)}
  ctx.strokeStyle="rgba(255,255,255,.85)";ctx.lineWidth=0.18;ctx.fillStyle="rgba(255,255,255,.9)";
  ctx.strokeRect(0,0,W,H);
  ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();
  ctx.beginPath();ctx.arc(W/2,H/2,9.15,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(W/2,H/2,0.3,0,Math.PI*2);ctx.fill();
  for(const side of [0,1]){
    const x0=side?W:0,d=side?-1:1;
    ctx.strokeRect(side?W-16.5:0,H/2-20.16,16.5,40.32);
    ctx.strokeRect(side?W-5.5:0,H/2-9.16,5.5,18.32);
    ctx.beginPath();ctx.arc(x0+d*11,H/2,0.3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();const a=Math.acos(5.5/9.15);
    if(side)ctx.arc(W-11,H/2,9.15,Math.PI-a,Math.PI+a);else ctx.arc(11,H/2,9.15,-a,a);ctx.stroke();
    // khung thành + lưới
    ctx.save();ctx.fillStyle="rgba(255,255,255,.12)";ctx.fillRect(side?W:-2,GY1,2,GW);
    ctx.strokeStyle="rgba(255,255,255,.35)";ctx.lineWidth=0.06;
    for(let k=0;k<=8;k++){const y=GY1+k*GW/8;ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x0-d*2,y);ctx.stroke()}
    for(let k=0;k<=3;k++){const x=x0-d*k*2/3;ctx.beginPath();ctx.moveTo(x,GY1);ctx.lineTo(x,GY2);ctx.stroke()}
    ctx.restore();
    ctx.save();ctx.strokeStyle="#fff";ctx.lineWidth=0.35;ctx.beginPath();
    ctx.moveTo(x0,GY1);ctx.lineTo(x0-d*2,GY1);ctx.lineTo(x0-d*2,GY2);ctx.lineTo(x0,GY2);ctx.stroke();ctx.restore();
  }
  for(const [cx,cy,a0] of [[0,0,0],[W,0,Math.PI/2],[W,H,Math.PI],[0,H,-Math.PI/2]]){ctx.beginPath();ctx.arc(cx,cy,1,a0,a0+Math.PI/2);ctx.stroke()}
}

function draw(){
  const {cw,ch,dpr,s}=view;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cw,ch);
  worldT();drawPitch();
  const b=G.ball,all=G.teams[0].players.concat(G.teams[1].players);
  // bóng đổ
  ctx.fillStyle="rgba(0,0,0,.25)";
  for(const p of all){ctx.beginPath();ctx.ellipse(p.x+0.35,p.y+0.4,1.05,0.8,0,0,Math.PI*2);ctx.fill()}
  for(const p of all){
    const t=p.team,gk=p.role==="GK";
    ctx.beginPath();ctx.arc(p.x,p.y,1.05,0,Math.PI*2);
    ctx.fillStyle=gk?t.gk[0]:t.color;ctx.fill();
    ctx.lineWidth=0.22;ctx.strokeStyle=gk?"#111":t.text;ctx.stroke();
    if(p===b.owner){ctx.beginPath();ctx.arc(p.x,p.y,1.75,0,Math.PI*2);ctx.strokeStyle="rgba(245,197,66,.9)";ctx.lineWidth=0.2;ctx.stroke()}
  }
  // vệt bóng khi sút
  const sp=Math.hypot(b.vx,b.vy);
  if(!b.owner&&sp>12){
    const g=ctx.createLinearGradient(b.x,b.y,b.x-b.vx*0.12,b.y-b.vy*0.12);
    g.addColorStop(0,"rgba(255,255,255,.7)");g.addColorStop(1,"rgba(255,255,255,0)");
    ctx.strokeStyle=g;ctx.lineWidth=0.6;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*0.12,b.y-b.vy*0.12);ctx.stroke();
  }
  ctx.fillStyle="rgba(0,0,0,.3)";ctx.beginPath();ctx.arc(b.x+0.25,b.y+0.3,0.45,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(b.x,b.y,0.48,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#222";ctx.lineWidth=0.08;ctx.stroke();
  // số áo (vẽ ở không gian màn hình để chữ luôn đứng thẳng)
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const fs=Math.max(6.5,s*1.15);ctx.font=`700 ${fs}px system-ui,sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";
  if(s>3.4)for(const p of all){const [x,y]=toScreen(p.x,p.y);ctx.fillStyle=p.role==="GK"?"#111":p.team.text;ctx.fillText(p.num,x,y+0.5)}
  // tên người đang giữ bóng
  const o=b.owner;
  if(o){
    const [x,y]=toScreen(o.x,o.y);ctx.font=`700 ${Math.max(11,s*1.3)}px system-ui,sans-serif`;
    const tw=ctx.measureText(o.nick).width+12,ty=y-s*2.6,th=Math.max(16,s*2);
    ctx.fillStyle="rgba(0,0,0,.6)";ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(x-tw/2,ty-th/2,tw,th,th/2);else ctx.rect(x-tw/2,ty-th/2,tw,th);
    ctx.fill();ctx.fillStyle=o.role==="GK"?o.team.gk[0]:o.team.color==="#1c1f26"?o.team.text:o.team.color;
    ctx.fillText(o.nick,x,ty+0.5);
  }
}

/* ---------------- Giao diện ---------------- */
const $=id=>document.getElementById(id);
const ov=$("ov"),lg=$("lg");
UI.log=(msg,strong,color)=>{const d=document.createElement("div");d.textContent=msg;if(strong)d.style.fontWeight="650";if(color)d.style.borderLeft=`4px solid ${color}`,d.style.paddingLeft="8px";lg.prepend(d)};
UI.ov=(a,b)=>{$("ovb").textContent=a;$("ovs").textContent=b;ov.classList.add("show")};
UI.hide=()=>ov.classList.remove("show");

/* ---------------- Bình luận viên (Web Speech) ---------------- */
const COMM={on:false,ok:typeof speechSynthesis!=="undefined",voice:null,cur:0,id:0,pending:null};
function pickVoice(){
  if(!COMM.ok)return;const vs=speechSynthesis.getVoices();
  COMM.voice=vs.find(v=>/^vi/i.test(v.lang))||null;
  $("vn").textContent=!vs.length?"":COMM.voice?`Giọng: ${COMM.voice.name}`:"Máy chưa có giọng tiếng Việt — sẽ đọc bằng giọng mặc định";
}
if(COMM.ok){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speakNow(text,prio,opt){
  const u=new SpeechSynthesisUtterance(text),my=++COMM.id;
  u.lang="vi-VN";if(COMM.voice)u.voice=COMM.voice;
  u.rate=Math.min(2,(opt.rate||1.2)*(1+(speed-1)*0.12));u.pitch=opt.pitch||1;u.volume=1;
  COMM.cur=prio;
  u.onend=u.onerror=()=>{
    if(my!==COMM.id)return;COMM.cur=0;
    const p=COMM.pending;COMM.pending=null;
    if(p&&COMM.on&&performance.now()-p.t<1600)speakNow(p.text,p.prio,p.opt);
  };
  speechSynthesis.speak(u);
}
const cap=$("cap");let capT=0;
UI.say=(text,prio=1,opt={})=>{
  if(prio>=2||!cap.classList.contains("show")||performance.now()-capT>700){cap.textContent="🎙 "+text;cap.classList.add("show");capT=performance.now();
    clearTimeout(UI._ct);UI._ct=setTimeout(()=>cap.classList.remove("show"),2200)}
  if(!COMM.on||!COMM.ok||!running)return;
  if(speechSynthesis.speaking||speechSynthesis.pending){
    if(prio>COMM.cur){COMM.pending=null;COMM.id++;speechSynthesis.cancel()}
    else{if(!COMM.pending||prio>=COMM.pending.prio)COMM.pending={text,prio,opt,t:performance.now()};return}
  }
  speakNow(text,prio,opt);
};
$("bs").onclick=()=>{
  if(!COMM.ok){$("vn").textContent="Trình duyệt này không hỗ trợ đọc giọng nói";return}
  COMM.on=!COMM.on;$("bs").classList.toggle("on",COMM.on);$("bs").textContent=COMM.on?"🔊 Bình luận: bật":"🔇 Bình luận: tắt";
  COMM.id++;speechSynthesis.cancel();COMM.pending=null;COMM.cur=0;
  if(COMM.on){pickVoice();speakNow("Xin chào quý vị khán giả! Trận đấu đang diễn ra vô cùng hấp dẫn!",4,{rate:1.15})}
};

let last=0,acc=0,speed=1,running=true,shown="";
function setupUI(){
  const[a,c]=G.teams;
  $("n0").textContent=a.name;$("n1").textContent=c.name;$("c0").style.background=a.color;$("c1").style.background=c.color;
  lg.innerHTML="";UI.hide();UI.log(`🔔 Bóng lăn! ${G.teams[G.firstKick].name} giao bóng`,true);
}
function refresh(){
  const[a,c]=G.teams,tp=a.poss+c.poss||1;
  const pa=Math.round(a.poss/tp*100);
  $("sc").textContent=`${a.score} - ${c.score}`;
  $("ck").textContent=G.state==="end"?"Kết thúc":G.state==="ht"?"Nghỉ giữa hiệp":`Hiệp ${G.half} · ${minute()}'`;
  $("pb").style.width=((G.half-1)*HALF+G.t)/(2*HALF)*100+"%";
  const html=[["Kiểm soát bóng",pa+"%",100-pa+"%"],["Sút",a.shots,c.shots],["Trúng đích",a.onT,c.onT],["Cứu thua",a.saves,c.saves]]
    .map(r=>`<div class="st"><span>${r[1]}</span><span>${r[0]}</span><span>${r[2]}</span></div>`).join("");
  if(html!==shown){$("stats").innerHTML=html;shown=html}
}
function frame(ts){
  const dt=Math.min(0.1,(ts-last)/1000||0);last=ts;
  if(running){acc+=dt*speed;while(acc>=STEP){step(STEP);acc-=STEP}}
  draw();refresh();requestAnimationFrame(frame);
}
$("bp").onclick=()=>{running=!running;$("bp").textContent=running?"⏸ Tạm dừng":"▶ Tiếp tục";if(!running&&COMM.ok){COMM.id++;speechSynthesis.cancel();COMM.pending=null;COMM.cur=0}};
$("bn").onclick=()=>{if(COMM.ok){COMM.id++;speechSynthesis.cancel();COMM.pending=null;COMM.cur=0}newMatch();setupUI();running=true;$("bp").textContent="⏸ Tạm dừng"};
document.querySelectorAll(".spd").forEach(btn=>btn.onclick=()=>{speed=+btn.dataset.s;document.querySelectorAll(".spd").forEach(x=>x.classList.toggle("on",x===btn))});
window.addEventListener("resize",layout);
layout();newMatch();setupUI();requestAnimationFrame(frame);
</script>
</body>
